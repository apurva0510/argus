name: IR Feeds Refresh

on:
  schedule:
    # GitHub cron is UTC-only. Every scheduled invocation runs the refresh
    # job; there is no Actions-side time-window skip.
    - cron: "30 22,23 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: ir-feeds-refresh
  cancel-in-progress: true

jobs:
  ir-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
      MARKET_DATA_PROVIDER: yfinance

    steps:
      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is required"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Refresh IR feeds
        run: python scripts/refresh_ir_feeds.py

      - name: Compute signals
        run: python scripts/compute_signals.py
