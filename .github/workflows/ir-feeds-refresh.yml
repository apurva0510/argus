name: IR Feeds Refresh

on:
  schedule:
    # GitHub cron is UTC-only. These two UTC times cover 6:30 PM ET in both
    # EDT and EST; the Python gate below is the source of truth.
    - cron: "30 22,23 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: ir-feeds-refresh
  cancel-in-progress: true

jobs:
  ir-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
      MARKET_DATA_PROVIDER: yfinance

    steps:
      - name: Determine if IR refresh window (ET)
        id: ir_refresh_window
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os

          is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          now_et = datetime.now(ZoneInfo("America/New_York"))
          is_weekday = now_et.weekday() < 5
          start = time(18, 30)
          end = time(19, 0)
          in_window = is_weekday and (start <= now_et.time() < end)
          run_job = is_manual or in_window
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run_job={'true' if run_job else 'false'}\n")
          print(f"now_et={now_et.isoformat()} is_manual={is_manual} in_window={in_window}")
          PY

      - name: Validate required secrets
        if: steps.ir_refresh_window.outputs.run_job == 'true'
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is required"; exit 1; }

      - name: Checkout repository
        if: steps.ir_refresh_window.outputs.run_job == 'true'
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        if: steps.ir_refresh_window.outputs.run_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.ir_refresh_window.outputs.run_job == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Refresh IR feeds
        if: steps.ir_refresh_window.outputs.run_job == 'true'
        run: python scripts/refresh_ir_feeds.py
