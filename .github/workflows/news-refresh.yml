name: News Refresh

on:
  schedule:
    # Every 2 hours, every day. GitHub cron is UTC-only.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}


concurrency:
  group: news-refresh
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      MARKET_DATA_PROVIDER: yfinance

    steps:
      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is required"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Refresh news
        run: python scripts/refresh_news.py --bypass-refresh-throttle

      - name: Compute signals
        run: python scripts/compute_signals.py

      - name: Generate theses
        run: python scripts/generate_theses.py

      - name: Run alerts
        run: python scripts/run_alerts.py
