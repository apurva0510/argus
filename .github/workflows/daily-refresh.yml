# Argus Daily Refresh — GitHub Actions Workflow
#
# Runs the daily close pipeline (prices → metrics → scores → filings → alerts)
# against a Supabase Postgres database on a weekday schedule.
#
# Required repository secrets:
#   DATABASE_URL        – Supabase connection string (postgresql://...)
#   DATABASE_PASSWORD   – Optional password used when DATABASE_URL contains a placeholder
#   SEC_USER_AGENT      – SEC EDGAR user-agent header
#   EMAIL_HOST          – (optional) SMTP host for alert emails
#   EMAIL_USERNAME      – (optional) SMTP username
#   EMAIL_PASSWORD      – (optional) SMTP password
#   EMAIL_TO            – (optional) alert recipient email

name: Daily Close Refresh

on:
  schedule:
    # GitHub cron is UTC-only. These two UTC times cover 5:30 PM ET in both
    # EDT and EST; the Python gate below is the source of truth.
    - cron: "30 21,22 * * 1-5"
  workflow_dispatch: {}


concurrency:
  group: daily-close-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      MARKET_DATA_PROVIDER: yfinance

    steps:
      - name: Determine if daily close window (ET)
        id: daily_close_window
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os

          is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          now_et = datetime.now(ZoneInfo("America/New_York"))
          is_weekday = now_et.weekday() < 5
          start = time(17, 30)
          end = time(18, 0)
          in_window = is_weekday and (start <= now_et.time() < end)
          run_job = is_manual or in_window
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run_job={'true' if run_job else 'false'}\n")
          print(f"now_et={now_et.isoformat()} is_manual={is_manual} in_window={in_window}")
          PY

      - name: Validate required secrets
        if: steps.daily_close_window.outputs.run_job == 'true'
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is required"; exit 1; }
          test -n "$SEC_USER_AGENT" || { echo "::error::SEC_USER_AGENT secret is required"; exit 1; }

      - name: Checkout repository
        if: steps.daily_close_window.outputs.run_job == 'true'
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        if: steps.daily_close_window.outputs.run_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.daily_close_window.outputs.run_job == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run daily refresh
        if: steps.daily_close_window.outputs.run_job == 'true'
        run: python scripts/run_daily_refresh.py --period 2y --skip-news
