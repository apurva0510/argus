[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Streamlit AI infrastructure stock watcher with SQLite and PostgreSQL support"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
argus-init-db = "argus.core.init_db:main"
argus-seed-companies = "argus.core.seed_companies:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: tests that require a disposable PostgreSQL database",
]


[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
