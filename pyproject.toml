[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Local-first Streamlit AI infrastructure stock watcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
argus-init-db = "argus.core.init_db:main"
argus-seed-companies = "argus.core.seed_companies:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.setuptools.packages.find]
include = ["argus*"]

