[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Streamlit AI infrastructure stock watcher with SQLite and PostgreSQL support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.44,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "plotly>=5.20,<6.0",
    "yfinance>=0.2.54,<0.3",
    "httpx>=0.27,<0.28",
    "feedparser>=6.0,<7.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pytest>=8.2,<9.0",
    "ruff>=0.5,<1.0",
    "psycopg[binary]>=3.1.18",
]

[project.scripts]
argus-init-db = "argus.core.init_db:main"
argus-seed-companies = "argus.core.seed_companies:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: tests that require a disposable PostgreSQL database",
]


[tool.setuptools.packages.find]
include = ["argus*"]
